name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: no internal refs in PR text
        if: github.event_name == 'pull_request'
        run: node scripts/no-internal-refs.check.mjs --pr
      - run: pnpm build
      - run: pnpm pack:check
